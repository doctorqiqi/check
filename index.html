<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旧件核对-增强版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --ios-blue: #007aff; --ios-green: #34c759; --ios-red: #ff3b30; --ios-grey: #8e8e93; --ios-bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-bg); margin: 0; padding: 12px; }
        
        /* 统计看板 */
        .header-box { 
            background: white; border-radius: 14px; padding: 15px; 
            display: flex; justify-content: space-around; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 22px; font-weight: bold; display: block; }
        .val-total { color: var(--ios-blue); }
        .val-done { color: var(--ios-green); }

        /* 按钮组 */
        .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-upload { background: var(--ios-blue); color: white; }
        .btn-pause { background: #ff9500; color: white; }
        .btn-resume { background: var(--ios-green); color: white; }
        .btn-reset { background: #8e8e93; color: white; grid-column: span 2; margin-top: 5px; opacity: 0.8; }
        .btn-export { background: white; color: var(--ios-blue); border: 1px solid var(--ios-blue); }

        /* 扫描容器 */
        #scanner-container { position: relative; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 12px; height: 180px; }
        #pause-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: none; z-index: 10;
            flex-direction: column; align-items: center; justify-content: center; color: white;
        }

        /* 列表卡片 */
        .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid #d1d1d6; transition: 0.2s; }
        .card.is-scanned { border-left-color: var(--ios-green); background: #fafff9; }
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
        .label { color: var(--ios-grey); }
        .val { font-weight: 500; text-align: right; word-break: break-all; }
        .qty-badge { background: #f2f2f7; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="stat-item"><span class="stat-num val-total" id="tNum">0</span><span class="stat-label">总数</span></div>
        <div class="stat-item"><span class="stat-num val-done" id="dNum">0</span><span class="stat-label">已核</span></div>
        <div class="stat-item"><span class="stat-num" id="lNum" style="color:#ff9500">0</span><span class="stat-label">剩余</span></div>
    </div>

    <div class="action-bar">
        <button class="btn btn-upload" onclick="document.getElementById('fileIn').click()">📁 上传清单</button>
        <button class="btn btn-export" onclick="exportExcel()">📤 导出结果</button>
        <button id="toggleBtn" class="btn btn-pause" onclick="toggleScan()" style="display:none">⏸ 暂停</button>
        <button id="resetBtn" class="btn btn-reset" onclick="resetAll()">🔄 重置全部进度</button>
    </div>
    
    <input type="file" id="fileIn" accept=".xlsx" style="display:none">

    <div id="scanner-container">
        <div id="reader"></div>
        <div id="pause-overlay"><b>扫描已停止</b></div>
    </div>

    <div id="list"></div>

    <script>
        let rawData = JSON.parse(localStorage.getItem('parts_data')) || [];
        let scannedMap = new Map(JSON.parse(localStorage.getItem('scanned_progress')) || []);
        let html5QrCode;
        let isRunning = false;

        // 音频合成器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 嘀
                gain.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.02);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'square'; osc.frequency.setValueAtTime(110, audioCtx.currentTime); // 咚
                gain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 初始化加载
        window.onload = () => { if(rawData.length > 0) { render(); document.getElementById('toggleBtn').style.display='flex'; } };

        document.getElementById('fileIn').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'binary'});
                rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                localStorage.setItem('parts_data', JSON.stringify(rawData));
                render();
                document.getElementById('toggleBtn').style.display='flex';
                if(!html5QrCode) initScanner();
            };
            reader.readAsBinaryString(e.target.files[0]);
        });

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            startScan();
        }

        function startScan() {
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, onScanSuccess).then(() => {
                isRunning = true; updateBtn();
            });
        }

        function toggleScan() {
            if (isRunning) {
                html5QrCode.stop().then(() => {
                    isRunning = false; updateBtn();
                    document.getElementById('pause-overlay').style.display = 'flex';
                });
            } else {
                document.getElementById('pause-overlay').style.display = 'none';
                startScan();
            }
        }

        function onScanSuccess(text) {
            if (rawData.some(i => i['旧件条码'] === text)) {
                if (!scannedMap.has(text)) {
                    scannedMap.set(text, new Date().toLocaleString());
                    localStorage.setItem('scanned_progress', JSON.stringify([...scannedMap]));
                    playSound('success');
                    if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                    render();
                }
            } else {
                playSound('error');
                if(navigator.vibrate) navigator.vibrate(500);
                alert("⚠ 错误：条码不匹配！\n" + text);
            }
        }

        function render() {
            document.getElementById('tNum').innerText = rawData.length;
            document.getElementById('dNum').innerText = scannedMap.size;
            document.getElementById('lNum').innerText = rawData.length - scannedMap.size;

            document.getElementById('list').innerHTML = rawData.map(item => {
                const done = scannedMap.has(item['旧件条码']);
                return `
                    <div class="card ${done ? 'is-scanned' : ''}">
                        <div class="row"><span class="label">保修单/VIN</span><span class="val">${item['保修单号'] || '-'}<br>${item['VIN'] || '-'}</span></div>
                        <div class="row"><span class="label">零件号</span><span class="val">${item['旧件编号'] || '-'}</span></div>
                        <div class="row"><span class="label">旧件条码</span><span class="val" style="color:var(--ios-blue)">${item['旧件条码']}</span></div>
                        <div class="row" style="margin-top:5px; border-top:1px dashed #eee; padding-top:5px">
                            <b>${done ? '✅ 已核对' : '⏳ 待扫描'}</b><span class="qty-badge">数量: ${item['数量'] || 1}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetAll() {
            if (confirm("确定要清空当前所有进度吗？上传的清单和已扫记录都将消失。")) {
                localStorage.clear();
                location.reload();
            }
        }

        function updateBtn() {
            const b = document.getElementById('toggleBtn');
            b.className = isRunning ? "btn btn-pause" : "btn btn-resume";
            b.innerHTML = isRunning ? "⏸ 暂停" : "▶️ 恢复";
        }

        function exportExcel() {
            const out = rawData.map(i => ({...i, '状态': scannedMap.has(i['旧件条码']) ? '已核对' : '未扫描', '核对时间': scannedMap.get(i['旧件条码']) || ''}));
            const ws = XLSX.utils.json_to_sheet(out);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "结果");
            XLSX.writeFile(wb, `核对报告_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
