<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旧件核对-14ProMax适配版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --ios-blue: #007aff; --ios-green: #34c759; --ios-red: #ff3b30; --ios-grey: #8e8e93; --ios-bg: #f2f2f7;
            /* 适配灵动岛安全区域 */
            --safe-top: env(safe-area-inset-top);
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--ios-bg); 
            margin: 0; 
            padding: calc(var(--safe-top) + 10px) 16px env(safe-area-inset-bottom) 16px; 
            color: #1c1c1e;
        }

        /* 顶部看板 - 增加阴影感和圆角适配大屏 */
        .header-box { 
            background: white; border-radius: 20px; padding: 18px; 
            display: flex; justify-content: space-around; margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 26px; font-weight: 800; display: block; letter-spacing: -0.5px; }
        .val-total { color: var(--ios-blue); }
        .val-done { color: var(--ios-green); }

        /* 按钮组 - 增加触控面积适配 Max 屏幕 */
        .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .btn { height: 50px; border-radius: 14px; border: none; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .btn-upload { background: var(--ios-blue); color: white; }
        .btn-export { background: white; color: var(--ios-blue); border: 1.5px solid var(--ios-blue); }
        .btn-pause { background: #ff9500; color: white; grid-column: span 1; }
        .btn-reset { background: #d1d1d6; color: #3a3a3c; grid-column: span 2; margin-top: 4px; font-size: 13px; height: 40px; }

        /* 扫描区域 - 针对 14 Pro Max 6.7寸屏优化比例 */
        #scanner-wrapper { 
            position: relative; border-radius: 24px; overflow: hidden; 
            background: #000; margin-bottom: 20px; aspect-ratio: 1 / 1; /* 方形扫描区在 Max 屏幕上更易对准 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #reader { width: 100%; height: 100%; }

        /* 扫描装饰与动效 */
        .scan-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .corner { position: absolute; width: 25px; height: 25px; border: 4px solid var(--ios-blue); border-radius: 4px; }
        .top-left { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .top-right { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .bottom-right { bottom: 30px; right: 30px; border-left: none; border-top: none; }
        
        .laser {
            position: absolute; left: 15%; width: 70%; height: 3px;
            background: linear-gradient(to right, transparent, var(--ios-blue), #fff, var(--ios-blue), transparent);
            box-shadow: 0 0 15px var(--ios-blue);
            top: 50%; animation: scanMove 2.5s infinite ease-in-out;
            z-index: 3; display: none;
        }
        @keyframes scanMove { 0% { top: 25%; } 50% { top: 75%; } 100% { top: 25%; } }

        /* 列表卡片 - 增加间距 */
        .card { background: white; border-radius: 18px; padding: 16px; margin-bottom: 12px; border-left: 6px solid #d1d1d6; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .card.is-scanned { border-left-color: var(--ios-green); background: #fafff9; }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .label { color: var(--ios-grey); font-size: 13px; }
        .val { font-weight: 600; text-align: right; word-break: break-all; max-width: 70%; }
        .qty-badge { background: #f2f2f7; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="stat-item"><span class="stat-num val-total" id="tNum">0</span><span class="stat-label">总清单</span></div>
        <div class="stat-item"><span class="stat-num val-done" id="dNum">0</span><span class="stat-label">已核对</span></div>
        <div class="stat-item"><span class="stat-num" id="lNum" style="color:#ff9500">0</span><span class="stat-label">剩余数</span></div>
    </div>

    <div class="action-bar">
        <button class="btn btn-upload" onclick="document.getElementById('fileIn').click()">📁 上传 XLSX</button>
        <button class="btn btn-export" onclick="exportExcel()">📤 导出 XLSX</button>
        <button id="toggleBtn" class="btn btn-pause" onclick="toggleScan()" style="display:none">⏸ 暂停扫描</button>
        <button class="btn btn-reset" onclick="resetAll()">🔄 清空所有进度</button>
    </div>
    
    <input type="file" id="fileIn" accept=".xlsx" style="display:none">

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scan-mask" id="visualMask">
            <div class="corner top-left"></div><div class="corner top-right"></div>
            <div class="corner bottom-left"></div><div class="corner bottom-right"></div>
            <div class="laser" id="laserLine"></div>
        </div>
        <div id="pause-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;color:white;">
            <b style="font-size:18px">扫描已暂停</b>
        </div>
    </div>

    <div id="list"></div>

    <script>
        // 核心逻辑保持一致，针对 iOS 14 Pro Max 环境做了微调
        let rawData = JSON.parse(localStorage.getItem('parts_data')) || [];
        let scannedMap = new Map(JSON.parse(localStorage.getItem('scanned_progress')) || []);
        let html5QrCode;
        let isRunning = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'success') {
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.02);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        window.onload = () => { if(rawData.length > 0) { render(); document.getElementById('toggleBtn').style.display='flex'; } };

        document.getElementById('fileIn').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'binary'});
                rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                localStorage.setItem('parts_data', JSON.stringify(rawData));
                render();
                document.getElementById('toggleBtn').style.display='flex';
                if(!html5QrCode) initScanner();
            };
            reader.readAsBinaryString(e.target.files[0]);
        });

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            startScan();
        }

        function startScan() {
            // 对 14 Pro Max 的 120Hz 屏幕优化 fps
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 20, qrbox: (w, h) => ({ width: w * 0.7, height: h * 0.7 }) }, 
                onScanSuccess
            ).then(() => {
                isRunning = true; updateBtn();
                document.getElementById('laserLine').style.display = 'block';
            });
        }

        function toggleScan() {
            if (isRunning) {
                html5QrCode.stop().then(() => {
                    isRunning = false; updateBtn();
                    document.getElementById('pause-overlay').style.display = 'flex';
                    document.getElementById('laserLine').style.display = 'none';
                });
            } else {
                document.getElementById('pause-overlay').style.display = 'none';
                startScan();
            }
        }

        function onScanSuccess(text) {
            const mask = document.getElementById('visualMask');
            const match = rawData.find(i => i['旧件条码'] === text);
            if (match) {
                if (!scannedMap.has(text)) {
                    scannedMap.set(text, new Date().toLocaleString());
                    localStorage.setItem('scanned_progress', JSON.stringify([...scannedMap]));
                    mask.style.borderColor = 'var(--ios-green)';
                    setTimeout(() => mask.style.borderColor = 'transparent', 400);
                    playSound('success');
                    if(navigator.vibrate) navigator.vibrate([40, 30, 40]);
                    render();
                }
            } else {
                mask.style.borderColor = 'var(--ios-red)';
                setTimeout(() => mask.style.borderColor = 'transparent', 400);
                playSound('error');
                if(navigator.vibrate) navigator.vibrate(400);
                alert("⚠ 条码不在清单中！\n" + text);
            }
        }

        function render() {
            document.getElementById('tNum').innerText = rawData.length;
            document.getElementById('dNum').innerText = scannedMap.size;
            document.getElementById('lNum').innerText = rawData.length - scannedMap.size;

            // 自动将“待扫描”排在前面，方便操作
            const sorted = [...rawData].sort((a,b) => scannedMap.has(a['旧件条码']) - scannedMap.has(b['旧件条码']));

            document.getElementById('list').innerHTML = sorted.map(item => {
                const done = scannedMap.has(item['旧件条码']);
                return `
                    <div class="card ${done ? 'is-scanned' : ''}">
                        <div class="row"><span class="label">保修单/VIN</span><span class="val">${item['保修单号'] || '-'}<br>${item['VIN'] || '-'}</span></div>
                        <div class="row"><span class="label">零件号</span><span class="val">${item['旧件编号'] || '-'}</span></div>
                        <div class="row"><span class="label">旧件条码</span><span class="val" style="color:var(--ios-blue); font-family:monospace;">${item['旧件条码']}</span></div>
                        <div class="row" style="margin-top:8px; border-top:1px dashed #eee; padding-top:10px">
                            <b style="font-size:15px; color:${done?'var(--ios-green)':'#333'}">${done ? '✅ 已核对' : '⏳ 待核对'}</b>
                            <span class="qty-badge">数量: ${item['数量'] || 1}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function resetAll() {
            if (confirm("确定要清空所有进度和清单吗？此操作不可撤销。")) { localStorage.clear(); location.reload(); }
        }

        function updateBtn() {
            const b = document.getElementById('toggleBtn');
            b.className = isRunning ? "btn btn-pause" : "btn btn-resume";
            b.innerHTML = isRunning ? "⏸ 暂停扫描" : "▶️ 恢复扫描";
        }

        function exportExcel() {
            const out = rawData.map(i => ({...i, '状态': scannedMap.has(i['旧件条码']) ? '已核对' : '未核对', '扫描时间': scannedMap.get(i['旧件条码']) || ''}));
            const ws = XLSX.utils.json_to_sheet(out);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "核对报告");
            XLSX.writeFile(wb, `旧件核对结果_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
