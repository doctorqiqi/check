<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旧件核对系统</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --ios-blue: #007aff; --ios-green: #34c759; --ios-grey: #8e8e93; --ios-bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--ios-bg); margin: 0; padding: 12px; color: #1c1c1e; }
        
        /* 统计区 */
        .header-box { 
            background: white; border-radius: 14px; padding: 15px; 
            display: flex; justify-content: space-around; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 22px; font-weight: 700; display: block; }
        .stat-label { font-size: 11px; color: var(--ios-grey); }

        /* 按钮 */
        .action-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; }
        .btn-main { background: var(--ios-blue); color: white; }
        .btn-sub { background: #e5e5ea; color: #3a3a3c; }

        /* 扫码窗口 */
        #reader { border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 12px; }

        /* 卡片列表 */
        .card { 
            background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px;
            position: relative; border-left: 5px solid #d1d1d6; transition: 0.3s;
        }
        .card.is-scanned { border-left-color: var(--ios-green); background: #fafff9; }
        
        /* 字段排版 */
        .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
        .label { color: var(--ios-grey); min-width: 65px; }
        .val { font-weight: 500; text-align: right; word-break: break-all; }
        .barcode-val { font-family: monospace; color: var(--ios-blue); font-weight: bold; }
        .qty-badge { background: #f2f2f7; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .is-scanned .qty-badge { background: var(--ios-green); color: white; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="stat-item"><span class="stat-num" id="tNum" style="color:var(--ios-blue)">0</span><span class="stat-label">总数</span></div>
        <div class="stat-item"><span class="stat-num" id="dNum" style="color:var(--ios-green)">0</span><span class="stat-label">已核对</span></div>
        <div class="stat-item"><span class="stat-num" id="lNum" style="color:#ff9500">0</span><span class="stat-label">剩余</span></div>
    </div>

    <div class="action-bar">
        <button class="btn btn-main" onclick="document.getElementById('xlsxInput').click()">上传清单</button>
        <button class="btn btn-sub" onclick="exportExcel()">导出结果</button>
    </div>
    <input type="file" id="xlsxInput" accept=".xlsx" style="display:none">

    <div id="reader"></div>
    <div id="list"></div>

    <script>
        let dataList = [];
        let scannedSet = new Map();

        document.getElementById('xlsxInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'binary'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                dataList = XLSX.utils.sheet_to_json(sheet);
                render();
                startScan();
            };
            reader.readAsBinaryString(file);
        });

        function render() {
            const listDiv = document.getElementById('list');
            document.getElementById('tNum').innerText = dataList.length;
            document.getElementById('dNum').innerText = scannedSet.size;
            document.getElementById('lNum').innerText = dataList.length - scannedSet.size;

            listDiv.innerHTML = dataList.map(item => {
                const sn = item['旧件条码'];
                const done = scannedSet.has(sn);
                return `
                    <div class="card ${done ? 'is-scanned' : ''}">
                        <div class="row">
                            <span class="label">保修单号</span>
                            <span class="val">${item['保修单号'] || '-'}</span>
                        </div>
                        <div class="row">
                            <span class="label">VIN</span>
                            <span class="val">${item['VIN'] || '-'}</span>
                        </div>
                        <div class="row">
                            <span class="label">零件号</span>
                            <span class="val">${item['旧件编号'] || '-'}</span>
                        </div>
                        <div class="row">
                            <span class="label">旧件条码</span>
                            <span class="val barcode-val">${sn}</span>
                        </div>
                        <div class="row" style="margin-top:8px; border-top:1px dashed #eee; padding-top:8px;">
                            <span style="font-weight:bold; color:${done? 'var(--ios-green)':'#333'}">${done ? '✓ 已核对' : '待扫描'}</span>
                            <span class="qty-badge">数量: ${item['数量'] || 1}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function onScan(text) {
            if (dataList.some(i => i['旧件条码'] === text)) {
                if (!scannedSet.has(text)) {
                    scannedSet.set(text, new Date().toLocaleString());
                    render();
                    if(navigator.vibrate) navigator.vibrate(200);
                }
            } else {
                alert("清单中无此条码：" + text);
            }
        }

        function startScan() {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScan);
        }

        function exportExcel() {
            const out = dataList.map(i => ({
                ...i,
                '核对状态': scannedSet.has(i['旧件条码']) ? '已核对' : '未扫描',
                '核对时间': scannedSet.get(i['旧件条码']) || ''
            }));
            const ws = XLSX.utils.json_to_sheet(out);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "核对结果");
            XLSX.writeFile(wb, `核对反馈_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
